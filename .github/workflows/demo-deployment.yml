name: Publish Demo Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and publish revision-tagged public images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          ghcr_owner="$(printf '%s' "$GH_REPOSITORY" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')"
          docker login ghcr.io --username "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          docker buildx create --use

          docker buildx build --platform linux/amd64 --push \
            --tag "ghcr.io/${ghcr_owner}/recipe-finder-importer:${IMAGE_TAG}" \
            --file Dockerfile .
          docker buildx build --platform linux/amd64 --push \
            --tag "ghcr.io/${ghcr_owner}/recipe-finder-api:${IMAGE_TAG}" \
            --file api/Dockerfile .
          docker buildx build --platform linux/amd64 --push \
            --tag "ghcr.io/${ghcr_owner}/recipe-finder-web:${IMAGE_TAG}" \
            --file web/Dockerfile .
