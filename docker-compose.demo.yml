name: recipe-graph-demo

services:
  # Demo mail capture: SMTP is internal only; the web inbox is reachable solely
  # through Caddy at /mailpit behind HTTP basic auth (demo credentials).
  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    environment:
      MP_WEBROOT: /mailpit/
      MP_UI_AUTH: mira:mira
      MP_MAX_MESSAGES: "500"
    mem_limit: 128m

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Search cache only: no persistence, bounded memory, least-recently-used eviction.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.demo}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
    mem_limit: 2g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:7474/ || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  importer:
    image: ghcr.io/${DEMO_GHCR_OWNER:?Set DEMO_GHCR_OWNER in .env.demo}/recipe-finder-importer:${DEMO_IMAGE_TAG:?Set DEMO_IMAGE_TAG in .env.demo}
    restart: "no"
    entrypoint: ["/app/scripts/compose-import.sh"]
    command: []
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.demo}"
      NEO4J_DATABASE: neo4j
    volumes:
      - ./data/prepared:/app/data/prepared:ro
      - import_state:/app/.compose-state

  account-migration:
    image: ghcr.io/${DEMO_GHCR_OWNER:?Set DEMO_GHCR_OWNER in .env.demo}/recipe-finder-importer:${DEMO_IMAGE_TAG:?Set DEMO_IMAGE_TAG in .env.demo}
    restart: "no"
    entrypoint: ["npm", "run", "migrate:accounts"]
    command: []
    depends_on:
      importer:
        condition: service_completed_successfully
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.demo}"
      NEO4J_DATABASE: neo4j

  api:
    image: ghcr.io/${DEMO_GHCR_OWNER:?Set DEMO_GHCR_OWNER in .env.demo}/recipe-finder-api:${DEMO_IMAGE_TAG:?Set DEMO_IMAGE_TAG in .env.demo}
    restart: unless-stopped
    depends_on:
      account-migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.demo}"
      NEO4J_DATABASE: neo4j
      REDIS_URL: redis://redis:6379
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      VERIFICATION_CODE_SECRET: "${VERIFICATION_CODE_SECRET:?Set VERIFICATION_CODE_SECRET in .env.demo}"
      EMAIL_FROM: noreply@recipe-graph.demo.test
      TRUST_PROXY_HOPS: "1"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DEMO_HOSTNAME: "${DEMO_HOSTNAME:?Set DEMO_HOSTNAME in .env.demo}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.demo:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  import_state:
  neo4j_data:
  caddy_data:
  caddy_config:
