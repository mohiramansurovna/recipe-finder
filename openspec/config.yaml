schema: spec-driven
githubCopilot:
  cloudAgent: true

context: |
  PROJECT STATE: EXISTING BACKEND APPLICATION. Treat the current repository,
  active specifications, and shipped API behavior as authoritative. The
  product is a private backend for a future first-party mobile client; there
  is no web client in scope.

  Product: Recipe Graph provides deterministic ingredient parsing, recipe
  search with filter-bound cursor pagination, recipe details, and a guarded
  data-preparation/import workflow backed by Neo4j.

  Stack: Node.js, TypeScript, Express, Zod, Vitest, Supertest, Neo4j Community,
  Docker Compose, Caddy, and operator-managed Terraform for the temporary
  demo. GitHub Actions publishes the importer and API images only.

  Hard constraints:
  - Preserve current API contracts, validation/errors, ranking and cursor
    semantics, data-import safeguards, rate limiting, and database privacy.
  - Keep Neo4j private; never commit secrets, raw/prepared data, or deployment
    state; do not include dataset identities or other personal data.
  - Keep demo security review, verified SSH, cost confirmation, and teardown
    safeguards effective.
  - Keep OpenSpec as the canonical scoped change record. Preserve archived
    changes; active specs describe current backend behavior.
  - Do not implement mobile, accounts, ratings/favorites, or recommendations
    as part of backend cleanup.

rules:
  proposal:
    - State which PRD requirement (FR-x, NFR, release) the change satisfies.
    - Identify explicit non-goals so scope stays small.
  specs:
    - Modify existing active capabilities when behavior changes.
    - Every requirement needs at least one WHEN/THEN scenario.
  design:
    - Follow the stack in context. Justify any new dependency.
  tasks:
    - Keep tasks dependency-ordered and include relevant verification.